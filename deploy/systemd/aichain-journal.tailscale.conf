# Drop-in: serve the viewer on the server's Tailscale address instead of loopback, so
# devices on the same tailnet can open http://100.98.150.35:8790 without an SSH tunnel.
# Not reachable from the public internet. The viewer has no login: anyone on the tailnet can read it.
# Install: /etc/systemd/system/aichain-journal.service.d/tailscale.conf
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStart=
ExecStart=/opt/aichain/.venv/bin/python -m aichain.journal.viewer --db /opt/aichain/data/journal/journal.db --host 100.98.150.35 --port 8790 --allow-public
