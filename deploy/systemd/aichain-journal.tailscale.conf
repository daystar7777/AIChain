# Drop-in: also serve the viewer on the server's Tailscale address (loopback stays, so the
# SSH tunnel keeps working). Tailnet devices open http://100.98.150.35:8790 directly.
# Not reachable from the public internet. The viewer has no login: anyone on the tailnet can read it.
# Install: /etc/systemd/system/aichain-journal.service.d/tailscale.conf
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
Restart=always
RestartSec=5
ExecStart=
ExecStart=/opt/aichain/.venv/bin/python -m aichain.journal.viewer --db /opt/aichain/data/journal/journal.db --knowledge /opt/aichain/data/knowledge/knowledge.db --reports /opt/aichain/data/reports --host 127.0.0.1 --host 100.98.150.35 --port 8790 --allow-public
